<title>Мнемозина Кино</title>
<style>
/* ===== Мнемозина Кино (phone) — design tokens: see DATA/SYSTEM/_CORE_PHONE.md «Оформление» ===== */
:root{
  --bg:#17171a;--bar:#1c1c20f0;--card:#222227;--card2:#2a2a30;--line:#33333a;
  --tx:#ececf0;--mut:#9a9aa3;--faint:#6c6c75;--acc:#8a5cf5;--acc2:#a585ff;
  --ok:#3fb27f;--bad:#e05252;--warn:#e3b341;
  --st-watching:#8a5cf5;--st-planned:#4a8fe0;--st-watched:#3fb27f;--st-dropped:#b75656;--st-unwatched:#6f6f6f;
  --r:14px;--top:calc(env(safe-area-inset-top) + 56px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
*{touch-action:manipulation}
.cal-grid{touch-action:pan-y}
body{padding:var(--top) 0 calc(env(safe-area-inset-bottom) + 24px);overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
/* top bar: 3 sections + gear */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:env(safe-area-inset-top) 10px 0;height:var(--top);background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px}
.tb{height:44px;min-width:44px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:7px;color:var(--mut);font-size:15px;font-weight:600}
.tb svg{width:22px;height:22px;flex-shrink:0}
.tb.on{color:var(--tx);background:var(--card2)}
.tb .lb{display:none}.tb.on .lb{display:inline}
.grow{flex:1}
.sync{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:4px;box-shadow:0 0 0 14px transparent;padding:0}
.sync.ok{background:var(--ok)}.sync.run{background:var(--warn)}.sync.bad{background:var(--bad)}
.page{padding:12px 14px 0}
h2{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px}
h2:first-child{margin-top:4px}
.empty{color:var(--mut);text-align:center;padding:28px 12px;font-size:15px}
.note{color:var(--mut);font-size:13px;margin:8px 4px}
/* poster */
.pst{width:46px;height:68px;border-radius:8px;flex-shrink:0;background:var(--card2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--faint);font-weight:700;font-size:18px}
.pst.big{width:84px;height:124px;border-radius:12px;font-size:28px}
/* «new episodes» card */
.nc{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:10px;margin-bottom:8px}
.nc .mid{flex:1;min-width:0}
.nc .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc .s{font-size:14px;color:var(--mut);margin-top:2px}
.nc .s b{color:var(--tx);font-weight:600}
.badge{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--acc2);background:#8a5cf522;border-radius:8px;padding:1px 7px}
.chk{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mut)}
.chk svg{width:22px;height:22px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk:active{transform:scale(.92)}
/* soon */
.soon{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px}
.soon:last-child{border-bottom:0}
.soon .d{width:74px;flex-shrink:0;color:var(--acc2);font-weight:600;font-size:14px}
.soon .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soon .e{color:var(--mut);font-size:14px}
.box{background:var(--card);border-radius:var(--r);padding:2px 12px}
/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 13px;border-radius:17px;background:var(--card);color:var(--mut);font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--tx);color:var(--bg)}
.chip i{font-style:normal;opacity:.6;font-weight:500}
/* list rows */
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:9px 10px;margin-bottom:8px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mut);margin-top:3px}
.pbar{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc)}
.arrow{color:var(--faint);width:18px;height:18px;flex-shrink:0}
.mbtn{height:36px;padding:0 12px;border-radius:10px;background:var(--card2);color:var(--mut);font-size:14px;font-weight:600;flex-shrink:0}
.mbtn.on{background:#3fb27f26;color:var(--ok)}
/* series screen */
.back{display:flex;align-items:center;gap:4px;color:var(--acc2);font-weight:600;height:40px;margin:-4px 0 4px -4px}
.back svg{width:22px;height:22px}
.hero{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.hero h1{font-size:21px;line-height:1.2;margin:2px 0 6px}
.hero .s{color:var(--mut);font-size:14px}
.stsel{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.stsel .chip.on{color:#fff}
.seas{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.seas::-webkit-scrollbar{display:none}
.ep{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.ep:last-child{border-bottom:0}
.ep .n{width:30px;text-align:right;color:var(--mut);font-weight:600;flex-shrink:0}
.ep .mid{flex:1;min-width:0}
.ep .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.ep .d{font-size:12px;color:var(--faint);margin-top:1px}
.ep.future{opacity:.5}
.ep .chk{width:38px;height:38px}
.ep .chk svg{width:18px;height:18px}
/* home v0.3 */
.hhead{display:flex;align-items:center;gap:8px;margin:20px 4px 8px}
.hhead:first-child{margin-top:4px}
.hhead h2{margin:0}
.hhead .cnt{font-size:12px;font-weight:700;color:var(--acc2);background:#8a5cf522;border-radius:8px;padding:1px 7px}
.dlabel{font-size:14px;font-weight:600;color:var(--tx);margin:12px 4px 6px}
.hb{padding:0 10px}
.hr{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.hr:last-child{border-bottom:0}
.hr .mid{flex:1;min-width:0}
.hr .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .s{font-size:13px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .s b{color:var(--tx);font-weight:600}
.hr .pst{width:40px;height:60px;border-radius:7px}
.hr .chk{width:42px;height:42px}.hr .chk svg{width:20px;height:20px}
.scard{background:var(--card);border-radius:var(--r);padding:10px 10px 4px;margin-bottom:10px}
.sc-top{display:flex;align-items:center;gap:12px;padding-bottom:8px}
.sc-top .mid{flex:1;min-width:0}
.sc-top .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-top .s{font-size:13px;color:var(--acc2);margin-top:2px;font-weight:600}
.sc-top .pst{width:40px;height:60px;border-radius:7px}
.sc-ep{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.sc-ep .mid{flex:1;min-width:0}
.sc-ep .e{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sc-ep .e b{font-weight:700}
.sc-ep .d{font-size:12px;color:var(--mut);margin-top:1px}
.sc-ep .chk{width:40px;height:40px}.sc-ep .chk svg{width:18px;height:18px}
.sc-more{display:block;width:100%;height:36px;border-top:1px solid var(--line);color:var(--acc2);font-weight:600;font-size:14px}
.calm{color:var(--mut);background:var(--card);border-radius:var(--r);padding:16px;text-align:center;font-size:15px}
.linkb{display:block;margin:10px auto 0;color:var(--acc2);font-weight:600;font-size:14px;height:36px}
/* links v0.4 */
.pastebtn{height:56px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;margin-top:4px}
.pastebtn svg{width:22px;height:22px}
.lrow{display:flex;gap:8px;margin-top:10px}
.linp{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:0 12px;font:inherit;font-size:15px}
.lrow .mbtn{height:44px}
.lk{padding:10px 0;border-bottom:1px solid var(--line)}
.lk:last-child{border-bottom:0}
.lt{font-size:14px;color:var(--mut)}.lt b{color:var(--tx);font-weight:600}
.lu{font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls{font-size:13px;margin-top:3px;display:flex;align-items:center;gap:6px;color:var(--mut)}
.ls i{width:7px;height:7px;border-radius:50%;display:block;background:var(--faint)}
.ls.ok i{background:var(--ok)}.ls.bad i{background:var(--bad)}.ls.wait i{background:var(--warn)}
/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.cal-h .m{flex:1;font-size:18px;font-weight:700;text-transform:capitalize}
.cal-h .nav{width:40px;height:40px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.cal-h .nav svg{width:20px;height:20px}
.cal-h .td{height:40px;padding:0 12px;border-radius:12px;background:var(--card);color:var(--acc2);font-weight:600;font-size:14px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--faint);font-weight:600;margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:var(--r);padding:6px}
.cd{height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-size:15px;font-weight:600;color:var(--tx)}
.cd.out{color:var(--faint);opacity:.45}
.cd.today{color:var(--acc2)}
.cd.sel{background:var(--acc);color:#fff}
.cd .dots{display:flex;gap:3px;height:6px}
.cd .dots i{width:6px;height:6px;border-radius:50%;display:block}
.cd.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.ev-ep{background:var(--acc)}.ev-season{background:var(--ok)}.ev-movie{background:#e39b3a}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:8px 4px 0}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:50%;display:block}
.dayh{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px}
.dayh b{font-size:17px}.dayh span{color:var(--mut);font-size:14px}
.evr{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:9px 10px;margin-bottom:8px}
.evr .mid{flex:1;min-width:0}
.evr .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evr .s{font-size:13px;color:var(--mut);margin-top:2px;display:flex;align-items:center;gap:6px}
.evr .s i{width:7px;height:7px;border-radius:50%;display:block}
.evr .chk{width:40px;height:40px}.evr .chk svg{width:18px;height:18px}
/* settings */
.set{background:var(--card);border-radius:var(--r);padding:4px 12px;margin-bottom:12px}
.set .it{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.set .it:last-child{border-bottom:0}
.set .it .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord{width:36px;height:36px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ord svg{width:18px;height:18px}.ord:disabled{opacity:.25}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx)}
.wide{width:100%;height:48px;border-radius:12px;background:var(--card2);font-weight:600;margin-top:8px}
.wide.acc{background:var(--acc);color:#fff}
.wide.red{color:var(--bad)}
/* login */
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;padding:0 24px;text-align:center}
.login h1{font-size:26px;margin:0 0 8px}
.login p{color:var(--mut);margin:0 0 22px}
/* sheet (ask) */
.sheet-bg{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet .q{font-weight:600;margin-bottom:6px}
.sheet .q2{color:var(--mut);font-size:14px;margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw}
</style>

<body>
<div class="top" id="top"></div>
<div id="app"></div>
<script>
// ======================================================================================================
// Мнемозина Кино — phone app. One page, no libraries. Data lives ONLY in Misha's Yandex Disk app folder:
//   app:/kino.json   — written by the PC (Obsidian, kino.js): titles, statuses, episodes (date «for me»), seen
//   app:/posters.json — written by the PC: small posters {id: dataURL}
//   app:/marks.json  — written by the phone: {ops:[{at, id, ep:"s x e", seen} | {at, id, status}]}; the PC applies them
//                      and writes kino.json.marks_applied = last applied «at» → the phone drops those ops
//   app:/phone.json  — phone settings (order of tracking, home sorting)
// The PC is the master copy. Technical notes: DATA/SYSTEM/_CORE_PHONE.md «Техническая часть».
// ======================================================================================================
const VERSION = "0.5.0";
const CLIENT_ID = "9823dc5712e243f1978ba0f4f2f7d76a";
const API = "https://cloud-api.yandex.net/v1/disk";
const HERE = location.origin + location.pathname;
const ST = { watching: "Смотрю", planned: "Буду", watched: "Смотрел", dropped: "Перестал", unwatched: "Не смотрел" };
const ST_SERIES = ["watching", "planned", "watched", "dropped", "unwatched"];
const ST_MOVIE = ["planned", "watched", "unwatched"];
const MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const WD_LONG = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
const MON_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

// ---------- tiny helpers
const $ = (s) => document.querySelector(s);
const h = (p, tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (p) p.appendChild(e); return e; };
const LS = {
  get(k, d) { try { const v = localStorage.getItem("kino." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { v === undefined ? localStorage.removeItem("kino." + k) : localStorage.setItem("kino." + k, JSON.stringify(v)); } catch (e) { } },
};
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const pd = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const dShort = (s) => { const d = pd(s); return d ? d.getDate() + " " + MON[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : "") : ""; };
const dSoon = (s) => { const d = pd(s); if (!d) return ""; const t = pd(today()); const n = Math.round((d - t) / 864e5); return n === 0 ? "сегодня" : n === 1 ? "завтра" : WD[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; };
const SVG = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  tv: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/>',
  film: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 7.5h4M3 12h18M3 16.5h4M17 7.5h4M17 16.5h4"/>',
  gear: '<path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  right: '<path d="m9 18 6-6-6-6"/>', left: '<path d="m15 18-6-6 6-6"/>',
  up: '<path d="m18 15-6-6-6 6"/>', down: '<path d="m6 9 6 6 6-6"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  paste: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
};
const ic = (name) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + SVG[name] + "</svg>";
function toast(t) { document.querySelectorAll(".toast").forEach(x => x.remove()); const e = h(document.body, "div", "toast", t); setTimeout(() => e.remove(), Math.max(2200, t.length * 55)); }

// ---------- state
const S = {
  token: LS.get("token", ""),
  kino: LS.get("kino", null),          // last kino.json from the PC
  posters: LS.get("posters", {}),      // id -> dataURL
  ops: LS.get("ops", []),              // my marks not yet confirmed by the PC
  phone: LS.get("phone", { order: [], homeSort: "new" }),
  tab: LS.get("tab", "home"), lmode: LS.get("lmode", "links"),
  serChip: LS.get("serChip", "watching"), movChip: LS.get("movChip", "planned"),
  links: LS.get("links", []),          // links I sent (last 30, for the list) — {at, url, kind, dest}
  lstat: LS.get("lstat", { applied: "", items: [] }),   // what the PC did with them (links_status.json)
  open: null, season: null,            // open series screen
  sync: "", syncErr: "",
};

// ---------- Yandex Disk (only the app folder «Приложения/Мнемозина Кино»)
(function takeToken() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get("access_token")) { S.token = q.get("access_token"); LS.set("token", S.token); history.replaceState(null, "", HERE); }
})();
function login() { location.href = "https://oauth.yandex.ru/authorize?response_type=token&client_id=" + CLIENT_ID + "&redirect_uri=" + encodeURIComponent(HERE); }
function logout() { S.token = ""; LS.set("token", undefined); draw(); }
async function ya(path) {
  const r = await fetch(API + path, { headers: { Authorization: "OAuth " + S.token } });
  if (r.status === 401) { logout(); throw new Error("нужно войти заново"); }
  return r;
}
// One Disk operation at a time: parallel writes of the same file (fast ▲▼ in ⚙) made Yandex answer «busy» → red dot (09.10).
// Busy / too many / server errors are retried 3 times with a short pause.
let DQ = Promise.resolve();
function disk(fn) { const p = DQ.then(fn, fn); DQ = p.catch(() => { }); return p; }
const busy = (st) => st === 409 || st === 423 || st === 429 || st >= 500;
async function retry(fn) {
  let last;
  for (let i = 0; i < 3; i++) {
    try { return await fn(); } catch (e) { last = e; if (!e.retry) throw e; await new Promise(r => setTimeout(r, 700 * (i + 1))); }
  }
  throw last;
}
function fail(msg, st) { const e = new Error(msg + (st ? " (" + st + ")" : "")); e.retry = !st || busy(st); return e; }
const getFile = (name) => disk(() => retry(() => getFile0(name)));
const putFile = (name, text) => disk(() => retry(() => putFile0(name, text)));
async function getFile0(name) {
  let r; try { r = await ya("/resources/download?path=" + encodeURIComponent("app:/" + name)); } catch (e) { if (/войти/.test(e.message)) throw e; throw fail("нет связи с Диском"); }
  if (r.status === 404) return null;
  if (!r.ok) throw fail("Диск не отдал " + name, r.status);
  const { href } = await r.json();
  let f; try { f = await fetch(href, { referrerPolicy: "no-referrer", cache: "no-store" }); } catch (e) { throw fail("нет связи с Диском"); }
  if (!f.ok) throw fail("Диск не отдал " + name, f.status);
  return await f.text();
}
async function putFile0(name, text) {
  let r; try { r = await ya("/resources/upload?overwrite=true&path=" + encodeURIComponent("app:/" + name)); } catch (e) { if (/войти/.test(e.message)) throw e; throw fail("нет связи с Диском"); }
  if (!r.ok) throw fail("Диск не принял " + name, r.status);
  const { href, method } = await r.json();
  let u; try { u = await fetch(href, { method: method || "PUT", body: new Blob([text], { type: "application/octet-stream" }) }); } catch (e) { throw fail("нет связи с Диском"); }
  if (!(u.ok || u.status === 201 || u.status === 202)) throw fail("Диск не принял " + name, u.status);
}

// ---------- the effective picture = PC data + my marks not yet applied
function applied() { return (S.kino && S.kino.marks_applied) || ""; }
function pending() { const a = applied(); return S.ops.filter(o => o.at > a); }
function titles() {
  const k = S.kino; if (!k) return [];
  const map = {};
  const list = (k.titles || []).map(t => { const c = Object.assign({}, t); c.seen = {}; for (const e of t.eps || []) if (e[3]) c.seen[e[0] + "x" + e[1]] = 1; map[c.id] = c; return c; });
  for (const o of pending()) {
    const t = map[o.id]; if (!t) continue;
    if (o.ep !== undefined) { if (o.seen) t.seen[o.ep] = 1; else delete t.seen[o.ep]; }
    if (o.status) t.status = o.status;
  }
  return list;
}
// eps rows from the PC: [season, episode, date for me, seen, title, source date, seen date]; «Episode 5» titles are noise
const eps = (t) => (t.eps || []).map(e => ({ s: e[0], e: e[1], air: e[2] || "", title: /^(Episode|Серия)\s*\d+$/i.test(e[4] || "") ? "" : (e[4] || ""), k: e[0] + "x" + e[1] }));
function info(t) {
  const d = today(), all = eps(t);
  const aired = all.filter(e => e.air && e.air <= d);
  const unseen = aired.filter(e => !t.seen[e.k]);
  const next = all.find(e => !t.seen[e.k]) || null;
  const lastNew = unseen.length ? unseen[unseen.length - 1].air : "";
  return { all, aired, unseen, next, lastNew, seen: all.filter(e => t.seen[e.k]).length };
}
function posterEl(p, t, big) {
  const e = h(p, "div", "pst" + (big ? " big" : ""));
  const src = S.posters[t.id];
  if (src) e.style.backgroundImage = "url(" + src + ")"; else e.textContent = (t.title || "?").trim()[0] || "?";
  return e;
}

// ---------- marks: saved on the phone at once, sent to the Disk a moment later
function addOp(op) {
  op.at = new Date().toISOString();
  S.ops.push(op); LS.set("ops", S.ops);
  clearTimeout(S.pushT); S.pushT = setTimeout(pushOps, 1200);
}
async function pushOps() {
  if (!S.token || S.pushing) return;
  const mine = pending(); if (!mine.length) return;
  S.pushing = true; setSync("run");
  try {
    let cur = { ops: [] };
    try { const t = await getFile("marks.json"); if (t) cur = JSON.parse(t); } catch (e) { if (/войти/.test(e.message)) throw e; }
    const a = applied();
    const keep = (cur.ops || []).filter(o => o.at > a);
    const seen = new Set(keep.map(o => o.at + o.id + (o.ep || "") + (o.status || "")));
    for (const o of mine) if (!seen.has(o.at + o.id + (o.ep || "") + (o.status || ""))) keep.push(o);
    keep.sort((x, y) => x.at < y.at ? -1 : 1);
    await putFile("marks.json", JSON.stringify({ ops: keep }));
    S.ops = keep.slice(); LS.set("ops", S.ops);
    setSync("ok");
  } catch (e) { setSync("bad", e.message); }
  S.pushing = false;
}
function markEp(t, list, on) {
  for (const e of list) addOp({ id: t.id, ep: e.k, seen: on });
  if (on && t.status !== "watching" && t.status !== "watched") addOp({ id: t.id, status: "watching" });
  draw();
}
function setStatus(t, st) { if (t.status === st) return; addOp({ id: t.id, status: st }); draw(); }

// ---------- loading from the Disk
async function load(quiet) {
  if (!S.token) return;
  setSync("run");
  try {
    const t = await getFile("kino.json");
    if (t) {
      const k = JSON.parse(t);
      const pv = S.kino && S.kino.posters_ver;
      S.kino = k; LS.set("kino", k);
      if (k.posters_ver && k.posters_ver !== pv || !Object.keys(S.posters).length) {
        const p = await getFile("posters.json");
        if (p) { S.posters = JSON.parse(p); LS.set("posters", S.posters); }
      }
      S.ops = S.ops.filter(o => o.at > applied()); LS.set("ops", S.ops);
    }
    const ls = await getFile("links_status.json");
    if (ls) { S.lstat = JSON.parse(ls); LS.set("lstat", S.lstat); }
    const ph = await getFile("phone.json");
    if (ph) { S.phone = Object.assign({ order: [], homeSort: "new" }, JSON.parse(ph)); LS.set("phone", S.phone); }
    setSync("ok");
    if (pending().length) pushOps();
    if (linksPending().length) pushLinks();
  } catch (e) { setSync("bad", e.message); }
  draw();
}
// settings: saved on the phone at once, sent to the Disk once you stop tapping
function savePhone() {

  clearTimeout(S.phoneT);

function setSync(s, err) {

}

  const k = S.kino || {};
  const pc = k.updated ? "список с компьютера от " + dShort(k.updated.slice(0, 10)) + " " + k.updated.slice(11, 16) : "списка с компьютера ещё нет";

function order(list) {

  const pos = (t) => { const i = o.indexOf(t.id); return i < 0 ? 1e6 : i; };

// Главная (v0.3, 09.10): three clear blocks instead of one mixed list
//  1. «Новые серии» — episodes that came out in the last 14 days (date «for me»), not seen yet; grouped by day, newest day first
//  2. «Продолжить» — «Смотрю» series with older unseen episodes: the next one to watch (+ how many are left)
//  3. «Скоро выйдут» — the next 7 days
const FRESH_DAYS = 14;
function dayTitle(ds) {
  const d = pd(ds), t = pd(today()), n = Math.round((t - d) / 864e5);
  if (n === 0) return "Сегодня"; if (n === 1) return "Вчера";
  return WD_LONG[d.getDay()] + ", " + d.getDate() + " " + MON_GEN[d.getMonth()];
}
function epRow(box, t, e, sub) {
  const r = h(box, "div", "hr");
  posterEl(r, t);
  const m = h(r, "div", "mid");
  h(m, "div", "t", t.title);
  const s = h(m, "div", "s"); h(s, "b", "", e.s + "×" + pad(e.e)); if (sub) s.append(" · " + sub);
  m.onclick = r.firstChild.onclick = () => { S.open = t.id; S.season = e.s; draw(); scrollTo(0, 0); };
  const ck = h(r, "button", "chk"); ck.innerHTML = ic("check"); ck.setAttribute("aria-label", "Посмотрел " + e.s + "×" + e.e);
  ck.onclick = () => { ck.classList.add("on"); setTimeout(() => markEp(t, [e], true), 180); };
  return r;
}
function drawHome(pg) {
  const all = titles(), d0 = today();
  const from = ymd(new Date(pd(d0).getTime() - (FRESH_DAYS - 1) * 864e5));
  const live = all.filter(t => t.kind === "series" && t.status !== "dropped");
  // 1. new: per series its unseen episodes out in the last 14 days; card = up to 3 newest (newest first); cards by newest date
  const cards = [];
  for (const t of live) {
    const fresh = eps(t).filter(e => e.air && e.air >= from && e.air <= d0 && !t.seen[e.k]).sort((a, b) => b.air < a.air ? -1 : b.air > a.air ? 1 : b.s - a.s || b.e - a.e);
    if (fresh.length) cards.push({ t, fresh });
  }
  const pos = (t) => { const i = (S.phone.order || []).indexOf(t.id); return i < 0 ? 1e6 : i; };
  if (S.phone.homeSort === "mine") cards.sort((a, b) => pos(a.t) - pos(b.t));
  else cards.sort((a, b) => (b.fresh[0].air > a.fresh[0].air ? 1 : b.fresh[0].air < a.fresh[0].air ? -1 : a.t.title.localeCompare(b.t.title, "ru")));
  const total = cards.reduce((n, c) => n + c.fresh.length, 0);

    const tm = h(top, "div", "mid"); h(tm, "div", "t", t.title);

    top.onclick = () => { S.open = t.id; S.season = fresh[0].s; draw(); scrollTo(0, 0); };
    for (const e of fresh.slice(0, 3)) {
      const r = h(c, "div", "sc-ep");
      const m = h(r, "div", "mid");

      ck.onclick = () => { ck.classList.add("on"); setTimeout(() => markEp(t, [e], true), 180); };

  }
  // 2. soon (7 days)
  const to = ymd(new Date(pd(d0).getTime() + 7 * 864e5));
  const soon = [];

  for (const t of all.filter(t => t.kind === "movie" && t.release && t.release > d0 && t.release <= to)) soon.push({ t, e: null });

    }
    const more = h(pg, "button", "linkb", "Весь календарь"); more.onclick = () => { S.tab = "cal"; LS.set("tab", "cal"); draw(); scrollTo(0, 0); };
  }
}
const e2k = (e) => "|" + e.s + "x" + e.e;
// statuses: the PC sends its list (kino.json statuses / st_series / st_movie); anything else found in the data still gets a chip,

function stLabel(k) { const m = (S.kino && S.kino.statuses) || ST; return m[k] || (k ? k : "Без статуса"); }

      const prev = i.all.filter(x => (x.s < e.s || (x.s === e.s && x.e < e.e)) && !t.seen[x.k] && x.air && x.air <= d);
      if (!prev.length) return markEp(t, [e], true);
      ask("Отметить и предыдущие?", "Не отмечено раньше: " + prev.length, [["Все до этой", () => markEp(t, prev.concat([e]), true)], ["Только эту", () => markEp(t, [e], true)]]);
    };
  }
  if (!i.all.length) h(pg, "div", "empty", "Серий пока нет");
}
function drawMovies(pg) {
  const mv = titles().filter(t => t.kind === "movie");
  const cnt = {}; for (const t of mv) cnt[t.status] = (cnt[t.status] || 0) + 1;
  const keys = stKeys("movie", mv);
  if (!keys.includes(S.movChip)) S.movChip = keys[0];
  chipRow(pg, keys, S.movChip, cnt, (k) => { S.movChip = k; LS.set("movChip", k); draw(); });
  const list = mv.filter(t => (t.status || "") === S.movChip).sort((a, b) => { const ua = upcoming(a) ? a.release : "", ub = upcoming(b) ? b.release : ""; if (ua || ub) { if (!ua) return 1; if (!ub) return -1; if (ua !== ub) return ua < ub ? -1 : 1; } return a.title.localeCompare(b.title, "ru"); });
  if (!list.length) h(pg, "div", "empty", "Пусто");
  for (const t of list) {
    const r = h(pg, "div", "row");
    posterEl(r, t);
    const m = h(r, "div", "mid");
    h(m, "div", "t", t.title);
    h(m, "div", "s", [t.year, upcoming(t)].filter(Boolean).join(" · "));
    const done = t.status === "watched";
    if (upcoming(t) && !done) continue;   // not out yet: nothing to mark
    const b = h(r, "button", "mbtn" + (done ? " on" : ""), done ? "✓ Смотрел" : "Смотрел");
    b.onclick = () => setStatus(t, done ? "planned" : "watched");
  }
}

// ---------- calendar: release days of everything in the library (dropped series are left out, like on the PC)
const MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MON_G = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const WD_FULL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
function eventsByDay(list) {
  const map = {};
  const add = (d, ev) => { if (!d) return; (map[d] = map[d] || []).push(ev); };
  for (const t of list) {
    if (t.status === "dropped") continue;
    if (t.kind === "series") for (const e of eps(t)) add(e.air, { t, e, type: e.e === 1 ? "season" : "ep" });
    else if (t.release) add(t.release, { t, e: null, type: "movie" });
  }
  return map;
}
function drawCal(pg) {
  const list = titles(), map = eventsByDay(list), d0 = today();
  if (!S.calSel) S.calSel = d0;
  if (!S.calM) { const t = pd(S.calSel); S.calM = { y: t.getFullYear(), m: t.getMonth() }; }
  const { y, m } = S.calM;
  const hd = h(pg, "div", "cal-h");
  h(hd, "div", "m", MONTHS[m] + " " + y);
  const go = (k) => { let mm = S.calM.m + k, yy = S.calM.y; if (mm < 0) { mm = 11; yy--; } if (mm > 11) { mm = 0; yy++; } S.calM = { y: yy, m: mm }; draw(); };
  const tdb = h(hd, "button", "td", "Сегодня"); tdb.onclick = () => { S.calSel = d0; S.calM = null; draw(); };
  const pv = h(hd, "button", "nav"); pv.innerHTML = ic("left"); pv.onclick = () => go(-1);
  const nx = h(hd, "button", "nav"); nx.innerHTML = ic("right"); nx.onclick = () => go(1);
  const wd = h(pg, "div", "cal-wd"); for (const w of ["пн", "вт", "ср", "чт", "пт", "сб", "вс"]) h(wd, "span", "", w);
  const grid = h(pg, "div", "cal-grid");
  const first = new Date(y, m, 1), shift = (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - shift);
  for (let i = 0; i < 42; i++) {
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), ds = ymd(dt);
    if (i >= 35 && dt.getMonth() !== m) break;
    const c = h(grid, "button", "cd" + (dt.getMonth() !== m ? " out" : "") + (ds === d0 ? " today" : "") + (ds === S.calSel ? " sel" : ""), String(dt.getDate()));
    const evs = map[ds] || [];
    const dots = h(c, "div", "dots");
    for (const type of ["season", "ep", "movie"]) if (evs.some(x => x.type === type)) h(dots, "i", "ev-" + type);
    c.onclick = () => { S.calSel = ds; if (dt.getMonth() !== m) S.calM = { y: dt.getFullYear(), m: dt.getMonth() }; draw(); };
  }
  // swipe left / right = month
  let sx = null;
  grid.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  grid.addEventListener("touchend", (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); }, { passive: true });
  const lg = h(pg, "div", "legend");
  for (const [k, l] of [["ep", "серия"], ["season", "новый сезон"], ["movie", "фильм"]]) { const x = h(lg, "span"); h(x, "i", "ev-" + k); x.append(l); }
  // the chosen day
  const sd = pd(S.calSel);
  const dh = h(pg, "div", "dayh"); h(dh, "b", "", sd.getDate() + " " + MON_G[sd.getMonth()]); h(dh, "span", "", WD_FULL[sd.getDay()] + (S.calSel === d0 ? " · сегодня" : ""));
  const evs = (map[S.calSel] || []).slice().sort((a, b) => a.t.title.localeCompare(b.t.title, "ru") || (a.e && b.e ? a.e.s - b.e.s || a.e.e - b.e.e : 0));
  if (!evs.length) h(pg, "div", "empty", "В этот день ничего не выходит");
  for (const { t, e, type } of evs) {
    const r = h(pg, "div", "evr");
    posterEl(r, t);
    const mid = h(r, "div", "mid");
    h(mid, "div", "t", t.title);
    const s = h(mid, "div", "s"); h(s, "i", "ev-" + type);
    s.append(type === "movie" ? "фильм" : (e.s + "×" + pad(e.e) + (type === "season" ? " · новый сезон" : "") + (e.title ? " · " + e.title : "")));
    if (type === "movie") { mid.onclick = () => { S.tab = "movies"; draw(); }; continue; }
    mid.onclick = r.firstChild.onclick = () => { S.season = e.s; S.open = t.id; draw(); scrollTo(0, 0); };
    const on = !!t.seen[e.k], out = e.air <= d0;
    const ck = h(r, "button", "chk" + (on ? " on" : "")); ck.innerHTML = ic("check");
    if (!out && !on) { ck.disabled = true; ck.style.opacity = ".35"; continue; }
    ck.onclick = () => markEp(t, [e], !on);
  }
}

// ---------- Ссылки (v0.4): links for the PC — copy a link anywhere, open the app, «Вставить».
// app:/links.json {items:[{at, url, kind, dest}]} — only links the PC has not taken yet (older than links_status.applied are
// dropped on the next write, so the file stays tiny). The PC answers in app:/links_status.json {applied, items:[{at, url, state}] last 50}.
// kind: instagram | twitter | youtube (dest video | clip | bookmark) | kino | other (dest video | inbox)
function linkKind(u) {
  if (/instagram\.com\//i.test(u)) return "instagram";
  if (/(?:^|\/\/|\.)(?:x|twitter)\.com\//i.test(u)) return "twitter";
  if (/youtube\.com|youtu\.be/i.test(u)) return "youtube";
  if (/myshows\.me\/(view|movie)\/|kinopoisk\.ru\/(film|series)\//i.test(u)) return "kino";
  return "other";
}
// clean link: Instagram / X lose «?img_index=1» and the like (the post stays the same); YouTube keeps ?v=
function cleanLink(u) { u = u.replace(/[.,;)]+$/, ""); return /instagram\.com|(?:x|twitter)\.com/i.test(u) ? u.replace(/[?#].*$/, "") : u; }
const shortLink = (u) => String(u || "").replace(/^https?:\/\/(www\.|m\.)?/i, "").replace(/[?#].*$/, "").replace(/\/+$/, "");
const KIND_RU = { instagram: "Инстаграм", twitter: "X", youtube: "YouTube", kino: "Кино", other: "Ссылка" };
const DEST_RU = { video: "скачать видео", clip: "клип", bookmark: "в закладки", inbox: "во «Входящие»" };
function linksPending() { const a = (S.lstat && S.lstat.applied) || ""; return S.links.filter(x => x.at > a); }
function addLink(url, kind, dest) {
  const at = new Date().toISOString();
  S.links = [{ at, url, kind, dest: dest || "" }].concat(S.links.filter(x => x.kind === "song" || x.url !== url || x.at > ((S.lstat && S.lstat.applied) || ""))).slice(0, 60);
  LS.set("links", S.links);
  clearTimeout(S.linkT); S.linkT = setTimeout(pushLinks, 800);
}
async function pushLinks() {
  if (!S.token || S.pushingL) return;
  const mine = linksPending(); if (!mine.length) return;
  S.pushingL = true; setSync("run");
  try {
    let cur = { items: [] };
    try { const t = await getFile("links.json"); if (t) cur = JSON.parse(t); } catch (e) { if (/войти/.test(e.message)) throw e; }
    const a = (S.lstat && S.lstat.applied) || "";
    const keep = (cur.items || []).filter(x => x.at > a);
    const have = new Set(keep.map(x => x.at + x.url + (x.text || "")));
    for (const x of mine) if (!have.has(x.at + x.url + (x.text || ""))) keep.push(x);
    keep.sort((x, y) => x.at < y.at ? -1 : 1);
    await putFile("links.json", JSON.stringify({ items: keep }));
    setSync("ok");
  } catch (e) { setSync("bad", e.message); }
  S.pushingL = false;
  if (S.tab === "links") draw();
}
function stateOf(x) {
  const st = (S.lstat.items || []).find(y => y.at === x.at && (y.url || "") === (x.url || ""));
  if (st) return { t: st.state, ok: !/не |ошибк/i.test(st.state) };
  if (x.at <= ((S.lstat && S.lstat.applied) || "")) return { t: "принято компьютером", ok: true };
  return { t: "ждёт компьютер", wait: true };
}
function takeText(text) {
  const urls = [...new Set((String(text || "").match(/https?:\/\/[^\s<>"']+/gi) || []).map(cleanLink))];
  if (!urls.length) { toast("В буфере нет ссылки"); return; }
  const ask1 = (i) => {
    if (i >= urls.length) { draw(); return; }
    const u = urls[i], k = linkKind(u);
    if (k === "youtube") return ask("YouTube — куда?", shortLink(u), [["Скачать видео", () => { addLink(u, k, "video"); done(i); }], ["Клип", () => { addLink(u, k, "clip"); done(i); }], ["В закладки", () => { addLink(u, k, "bookmark"); done(i); }]], () => ask1(i + 1));
    if (k === "other") return ask("Что сделать со ссылкой?", shortLink(u), [["Скачать видео", () => { addLink(u, k, "video"); done(i); }], ["Во «Входящие»", () => { addLink(u, k, "inbox"); done(i); }]], () => ask1(i + 1));
    addLink(u, k, ""); done(i);
  };
  const done = (i) => { toast(urls.length > 1 ? "Записано " + (i + 1) + " из " + urls.length : "Ссылка записана"); ask1(i + 1); };
  ask1(0);
}
async function pasteNow() {
  let t = "";
  try { t = await navigator.clipboard.readText(); } catch (e) { toast("Телефон не дал прочитать буфер — вставь ссылку в поле ниже"); return; }
  takeText(t);
}
// songs: just text (typed, or copied from Shazam) — the PC writes them into DATA/CONFIG/ОЧЕРЕДИ/SONGS.md
function cleanSong(t) {
  t = String(t || "").replace(/https?:\/\/\S+/g, " ").replace(/\s+/g, " ").trim();
  let m = /(?:нашёл|нашел|нашла|нашли)\s*(?:\(а\))?\s+(.+?)\s+(?:с помощью|через)\s+Shazam/i.exec(t) || /discover(?:ed)?\s+(.+?)\s+(?:with|using|on)\s+Shazam/i.exec(t) || /Shazam[:\s-]+(.+)/i.exec(t);
  if (m) t = m[1];
  return t.replace(/^[«"“]|[»"”.]$/g, "").trim();
}
function addSong(text) {
  const t = cleanSong(text);
  if (!t) { toast("Пусто — напиши название песни"); return false; }
  const at = new Date().toISOString();
  S.links = [{ at, url: "", text: t, kind: "song", dest: "" }].concat(S.links).slice(0, 60);
  LS.set("links", S.links);
  clearTimeout(S.linkT); S.linkT = setTimeout(pushLinks, 800);
  toast("Песня записана"); return true;
}
function drawSongs(pg) {
  const row = h(pg, "div", "lrow");
  const inp = h(row, "input", "linp"); inp.placeholder = "название, исполнитель — как запомнил"; inp.autocomplete = "off";
  const ok = h(row, "button", "mbtn", "Записать"); ok.onclick = () => { if (addSong(inp.value)) { inp.value = ""; draw(); } };
  inp.onkeydown = (e) => { if (e.key === "Enter") ok.click(); };
  const pb = h(pg, "button", "wide", "Вставить из буфера (Shazam)");
  pb.onclick = async () => { let t = ""; try { t = await navigator.clipboard.readText(); } catch (e) { toast("Телефон не дал прочитать буфер"); return; } if (addSong(t)) draw(); };
  h(pg, "div", "note", "Компьютер сложит песни в список «Песни» (SONGS.md), куда поставить окошко — решим потом.");
  const songs = S.links.filter(x => x.kind === "song");
  const hd = h(pg, "div", "hhead"); h(hd, "h2", "", "Песни"); if (songs.length) h(hd, "span", "cnt", String(songs.length));
  if (!songs.length) { h(pg, "div", "calm", "Пока ни одной"); return; }
  const box = h(pg, "div", "box hb");
  for (const x of songs) {
    const r = h(box, "div", "lk");
    h(r, "div", "lu", x.text);
    const st = stateOf(x); const sEl = h(r, "div", "ls" + (st.wait ? " wait" : st.ok ? " ok" : " bad"), st.t + " · " + dShort(x.at.slice(0, 10))); sEl.prepend(h(null, "i"));
  }
}
function drawLinks(pg) {
  const sg = h(pg, "div", "seg");
  for (const [k, l] of [["links", "Ссылки"], ["songs", "Песни"]]) { const b = h(sg, "button", (S.lmode || "links") === k ? "on" : "", l); b.onclick = () => { S.lmode = k; LS.set("lmode", k); draw(); }; }
  if (S.lmode === "songs") return drawSongs(pg);
  const b = h(pg, "button", "wide acc pastebtn"); b.innerHTML = ic("paste") + "<span>Вставить из буфера</span>"; b.onclick = pasteNow;
  const row = h(pg, "div", "lrow");
  const inp = h(row, "input", "linp"); inp.placeholder = "или вставь ссылку сюда"; inp.autocapitalize = "off"; inp.autocomplete = "off"; inp.spellcheck = false;
  const ok = h(row, "button", "mbtn", "Добавить"); ok.onclick = () => { const v = inp.value; inp.value = ""; takeText(v); };
  inp.onkeydown = (e) => { if (e.key === "Enter") ok.click(); };
  h(pg, "div", "note", "Компьютер заберёт ссылки, когда открыта главная в Obsidian. Инстаграм и X встанут в списки — качать кнопкой «Скачать» на ПК.");
  const hd = h(pg, "div", "hhead"); h(hd, "h2", "", "Последние");
  const n = linksPending().length; if (n) h(hd, "span", "cnt", "ждут: " + n);
  const onlyLinks = S.links.filter(x => x.kind !== "song");
  if (!onlyLinks.length) { h(pg, "div", "calm", "Пока ничего не отправлено"); return; }
  const box = h(pg, "div", "box hb");
  for (const x of onlyLinks.slice(0, 30)) {
    const r = h(box, "div", "lk");
    const top = h(r, "div", "lt"); h(top, "b", "", KIND_RU[x.kind] || "Ссылка"); if (x.dest) top.append(" · " + DEST_RU[x.dest]);
    h(r, "div", "lu", shortLink(x.url));
    const st = stateOf(x); const s = h(r, "div", "ls" + (st.wait ? " wait" : st.ok ? " ok" : " bad"), st.t);
    s.prepend(h(null, "i"));
  }
}
function drawGear(pg) {
  h(pg, "h2", "", "Главная: порядок новых серий");
  const sg = h(pg, "div", "seg");
  for (const [k, l] of [["new", "Сначала новые"], ["mine", "Мой порядок"]]) {
    const b = h(sg, "button", S.phone.homeSort === k ? "on" : "", l);
    b.onclick = () => { S.phone.homeSort = k; savePhone(); draw(); };
  }
  h(pg, "h2", "", "Мой порядок отслеживания");
  const ser = order(titles().filter(t => t.kind === "series" && t.status === "watching"));
  if (!ser.length) h(pg, "div", "note", "Нет сериалов со статусом «Смотрю»");
  else {
    const box = h(pg, "div", "set");
    ser.forEach((t, idx) => {
      const it = h(box, "div", "it");
      h(it, "span", "t", t.title);
      const mv = (dir) => { const ids = ser.map(x => x.id); const j = idx + dir; [ids[idx], ids[j]] = [ids[j], ids[idx]]; S.phone.order = ids; savePhone(); draw(); };
      const u = h(it, "button", "ord"); u.innerHTML = ic("up"); u.disabled = idx === 0; u.onclick = () => mv(-1);
      const dn = h(it, "button", "ord"); dn.innerHTML = ic("down"); dn.disabled = idx === ser.length - 1; dn.onclick = () => mv(1);
    });
  }
  h(pg, "h2", "", "Синхронизация");
  h(pg, "div", "note", syncText());
  const rb = h(pg, "button", "wide", "Обновить сейчас"); rb.onclick = () => load();
  const lo = h(pg, "button", "wide red", "Выйти из Яндекса"); lo.onclick = () => ask("Выйти?", "Отметки, которые ещё не ушли, останутся на телефоне.", [["Выйти", logout]]);
  h(pg, "div", "note", "Версия " + VERSION);
}
function ask(q, q2, actions, onCancel) {
  const bg = h(document.body, "div", "sheet-bg"); const sh = h(bg, "div", "sheet");
  h(sh, "div", "q", q); if (q2) h(sh, "div", "q2", q2);
  actions.forEach(([l, fn], i) => { const b = h(sh, "button", "wide" + (i === 0 ? " acc" : ""), l); b.onclick = () => { bg.remove(); fn(); }; });
  const c = h(sh, "button", "wide", "Отмена"); c.onclick = () => { bg.remove(); if (onCancel) onCancel(); };
  bg.onclick = (e) => { if (e.target === bg) { bg.remove(); if (onCancel) onCancel(); } };
}

// ---------- start
document.addEventListener("gesturestart", (e) => e.preventDefault());   // no pinch zoom (iOS ignores user-scalable=no)
draw();
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); });   // back to the app → fresh data
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
</script>
